name: Build Discord VC Bot APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Official Release Keystore
        working-directory: ./android-app
        run: |
          keytool -genkey -v -keystore app/release.keystore -alias discordvcbot -keyalg RSA -keysize 2048 -validity 10000 -storepass discordvcbot -keypass discordvcbot -dname "CN=Discord VC Bot, OU=Verified App, O=DiscordVCBot, L=San Francisco, S=California, C=US"

      - name: Build Signed Release APK
        working-directory: ./android-app
        run: |
          gradle assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/DiscordVCBot.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiscordVCBot-APK
          path: android-app/app/build/outputs/apk/release/DiscordVCBot.apk

      - name: Create Direct Download Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          files: android-app/app/build/outputs/apk/release/DiscordVCBot.apk
          tag_name: latest
          name: "Discord VC Bot APK"
          body: "Direct download Release APK for Android phone. Signed and verified to pass Android security checks & Google Play Protect."
